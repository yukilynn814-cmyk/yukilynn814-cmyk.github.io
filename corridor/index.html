<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>走廊 · 程序化生成的恐怖场景</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
            font-family:system-ui,"Microsoft YaHei",sans-serif}
  canvas{display:block}
  #ui{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:flex-start;
        cursor:pointer;
        /* 主菜单：压暗的走廊 + 右手边吊着的人（3D 场景，静止） */
        background:linear-gradient(90deg,rgba(2,4,6,.94) 0%,rgba(2,4,6,.82) 30%,rgba(3,6,8,.42) 55%,rgba(3,6,8,.18) 100%)}
    #ui.hide{display:none}
    .box{text-align:left;padding:0 26px 0 max(3.4vw,26px);width:32vw;min-width:300px;max-width:430px;
         display:flex;flex-direction:column;justify-content:center}
  h1{font-size:19px;letter-spacing:.42em;font-weight:500;color:#e4e8ef;margin:0 0 6px}
  .sub{font-size:12px;color:#4e5563;letter-spacing:.1em;margin:0 0 26px}
  p{font-size:13px;line-height:2.1;color:#79808f;margin:4px 0}
  .k{display:inline-block;border:1px solid #343a45;border-radius:4px;padding:1px 7px;
     margin:0 2px;font-size:11px;color:#98a0ae}
  .go{margin-top:26px;font-size:13px;color:#8d94a2;animation:bl 2.6s infinite}
  @keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
  .set{margin:22px auto 0;font-size:12px;color:#79808f;text-align:left;display:inline-block;
       background:rgba(255,255,255,.03);border:1px solid #262c36;border-radius:8px;padding:12px 18px}
  .set label{display:block;margin:8px 0;letter-spacing:.04em;white-space:nowrap}
  .set input[type=range]{width:170px;vertical-align:middle;margin:0 8px;accent-color:#7f8ea3}
  .set b{color:#c6cedb;font-weight:500;display:inline-block;min-width:38px}
  .set .gpu{font-size:11px;color:#69707d;margin:2px 0 8px;letter-spacing:0;line-height:1.5}
  .set .gpu b{color:#9aa3b2;font-weight:500}
  .set .warn{color:#c47a6a}
  .set select{background:#141820;color:#c6cedb;border:1px solid #2b3340;border-radius:5px;
    padding:3px 8px;font-size:12px;font-family:inherit;margin-left:6px}
  .set .hint{font-size:11px;color:#4e5563;margin-top:9px;letter-spacing:0}

  .view{display:none}
  .view.on{display:block}
  #pMain.on{display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .btn{appearance:none;background:rgba(10,14,18,.38);backdrop-filter:blur(3px);
       border:1px solid rgba(255,255,255,.14);color:#b9c2d0;
       font:inherit;font-size:13px;letter-spacing:.14em;padding:10px 20px;border-radius:6px;
       cursor:pointer;transition:.16s;width:100%;margin-top:6px;text-align:left}
  /* 阵营选择（2.0） */
  .campRow{display:flex;gap:10px;margin:16px 0 10px}
  .campPick{flex:1;appearance:none;background:rgba(10,14,18,.38);backdrop-filter:blur(3px);
            border:1px solid rgba(255,255,255,.14);color:#cfd6e0;font:inherit;font-size:13.5px;
            padding:20px 8px;border-radius:9px;cursor:pointer;letter-spacing:.12em;transition:.16s}
  .campPick small{display:block;font-size:10.5px;color:#7b8492;margin-top:7px;letter-spacing:0;line-height:1.55}
  .campPick:hover{background:rgba(48,58,70,.55);border-color:#6b7d92;color:#fff}
  .btn:hover{background:rgba(255,255,255,.085);color:#eef1f6;border-color:#3c4553}
  .btn.primary{font-size:14.5px;letter-spacing:.22em;padding:12px 46px;border-color:#4a5d74;color:#f2f6fb;
    background:linear-gradient(180deg,rgba(140,175,215,.20),rgba(110,140,180,.05));
    box-shadow:0 0 26px rgba(130,170,220,.10) inset}
  .btn.primary:hover{background:linear-gradient(180deg,rgba(140,175,215,.30),rgba(110,140,180,.10));
    box-shadow:0 0 30px rgba(130,170,220,.22)}
  .btn.quit:hover{border-color:#5c3030;color:#d89184;background:rgba(120,40,40,.13)}
  h2{font-size:12px;font-weight:500;letter-spacing:.22em;color:#8d95a4;margin:0 0 14px;text-align:center}
  #keyList{margin:0 auto 4px;max-width:420px}
  .row{display:flex;justify-content:space-between;gap:20px;font-size:12.5px;color:#8d95a4;
       line-height:2.15;letter-spacing:.03em}
  .row .key{color:#c6cedb}
  .sw{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 14px;max-width:330px;
      margin-left:auto;margin-right:auto}
  .sw i{width:30px;height:30px;border-radius:6px;cursor:pointer;border:2px solid transparent;
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.45);transition:.15s}
  .sw i:hover{transform:scale(1.08)}
  .sw i.on{border-color:#e4e8ef;transform:scale(1.08)}
  .foot{margin-top:22px;font-size:10.5px;color:#333a45;letter-spacing:.16em}
  #skinPrev{display:block;margin:0 auto 6px;background:rgba(255,255,255,.02);border-radius:8px}

  #hud{position:fixed;left:14px;bottom:12px;z-index:5;font-size:11px;color:#3f4553;
       letter-spacing:.05em;pointer-events:none}
  #stam{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);width:186px;height:5px;
        background:rgba(255,255,255,.09);border-radius:3px;overflow:hidden;z-index:6;
        opacity:0;transition:opacity .45s}
  #stam.on{opacity:1}
  #stam i{display:block;height:100%;width:100%;background:#cfd8e4;border-radius:3px}
  #stam i.low{background:#c7573f}
  #fps{position:fixed;right:12px;bottom:12px;z-index:5;font-size:12px;color:#79808f;
       letter-spacing:.05em;pointer-events:none}
  /* —— 2.0：虚拟准心 / 鬼视角红滤镜 / 致盲 / 交互提示 —— */
  .ctlWrap{display:flex;gap:14px;align-items:flex-start;margin:6px 0 14px}
  .ctlBox{background:rgba(12,16,20,.55);border:1px solid #262c36;border-radius:8px;padding:12px 14px;min-width:270px}
  .ctlTitle{font-size:11px;letter-spacing:.28em;color:#7f8ea3;margin-bottom:10px}
  .ctlCols{display:flex;gap:22px}
  .ctlWho{font-size:12px;color:#9fd6c2;margin-bottom:6px;letter-spacing:.1em}
  .ctlWho.red{color:#e08b7c}
  .verBox{min-width:200px}
  .row{display:flex;gap:10px;align-items:baseline;font-size:12px;color:#8b95a3;margin:4px 0;white-space:nowrap}
  .row .key{display:inline-block;min-width:56px;text-align:center;border:1px solid #343a45;border-radius:4px;
            padding:1px 6px;font-size:11px;color:#c6cedb}
  /* —— 3.0：主界面独立的恐怖背景（和游戏场景无关）—— */
  #ui{background:linear-gradient(180deg, rgba(3,5,8,.28), rgba(2,4,6,.55))}
  /* —— 3.0：鬼跳脸（只对玩家触发） —— */
  #jumpScare{position:fixed;inset:0;z-index:85;pointer-events:none;opacity:0;background:#000;overflow:hidden}
  #jumpScare canvas{width:100%;height:100%;display:block;transform-origin:50% 46%}
  #jumpScare.on{animation:jsFade .95s ease-out forwards}
  #jumpScare.on canvas{animation:jsZoom .95s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes jsFade{0%{opacity:0}6%{opacity:1}70%{opacity:1}100%{opacity:0}}
  @keyframes jsZoom{0%{transform:scale(.55) rotate(-2deg)}25%{transform:scale(1.02) rotate(1.5deg)}
                    55%{transform:scale(1.10) rotate(-1deg)}100%{transform:scale(1.42) rotate(0deg)}}

  #xhair{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;
         background:#e8eef5;z-index:7;pointer-events:none;opacity:var(--xh,.25);
         transition:background .15s,transform .15s,opacity .15s}
  #xhair.hot{background:rgba(242,214,140,.95);transform:scale(1.6)}
  #redview{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity .4s;
           background:radial-gradient(circle at 50% 50%,rgba(150,20,16,.07) 0%,rgba(120,10,8,.26) 100%)}
  #blind{position:fixed;inset:0;background:#000;z-index:12;opacity:0;pointer-events:none}
  #prompt{position:fixed;left:50%;top:57%;transform:translateX(-50%);z-index:7;font-size:12px;
          color:#cbd3de;letter-spacing:.08em;opacity:0;transition:opacity .07s;pointer-events:none;
          text-shadow:0 0 10px #000}
  #items{position:fixed;left:14px;bottom:34px;z-index:6;font-size:11px;color:#8b93a2;letter-spacing:.05em;display:none}
  #ghostTag{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:8;font-size:11px;
            letter-spacing:.34em;color:rgba(255,126,116,.8);opacity:0;transition:opacity .3s}

    /* 3.0：菜单页（选择阵营/设置/按键…）沿用同一张背景图 */
    #ui.menuBg{background:linear-gradient(90deg,rgba(2,4,6,.90) 0%,rgba(2,4,6,.72) 26%,rgba(3,6,8,.34) 52%,rgba(3,6,8,.06) 78%,rgba(3,6,8,0) 100%)}
    #ui.menuBg .box{padding-left:max(3.4vw,26px)}

    /* 3.0：按键说明页重排（三栏，不再挤在一起） */
    #pControls{width:min(1020px,94vw);max-width:1020px}
    #pControls .ctlWrap{display:grid;grid-template-columns:1fr 1fr 196px;gap:16px;
                        align-items:start;margin:8px 0 18px}
    #pControls .ctlBox{min-width:0;padding:16px 18px;border-radius:10px}
    #pControls .ctlWho{font-size:12px;letter-spacing:.18em;margin-bottom:12px;
                       padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.07)}
    #pControls .row{margin:8px 0;font-size:12.5px;line-height:1.5;align-items:flex-start;
                    justify-content:flex-start;gap:12px}
    #pControls .row .key{min-width:66px;flex:0 0 66px;color:#d8dfe7;letter-spacing:.04em}
    #pControls .row span:last-child{color:#8c96a4;white-space:normal}

    #pControls .ctlBox{background:rgba(9,12,16,.80)}
    #pControls .verBox div{line-height:2.0}
    #pControls .btn.back{width:220px}
    #pControls .row{margin:9px 0}
    #pControls .verBox .ctlTitle{font-size:11px;letter-spacing:.28em;color:#7f8ea3;margin-bottom:12px}

    /* 鬼的体力条（细一点，红色，压在人类体力条下面） */
    #stamAI{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:132px;height:3px;
            background:rgba(255,255,255,.10);border-radius:3px;opacity:0;transition:opacity .25s;z-index:12;overflow:hidden}
    #stamAI.on{opacity:.9}
    #stamAI i{display:block;height:100%;width:100%;background:#c2564a;border-radius:3px;transition:width .08s linear}
    /* 加载遮罩 */
    #loadMask{position:fixed;inset:0;z-index:95;background:#05070a;display:none;
              align-items:center;justify-content:center;flex-direction:column;gap:14px;
              color:#8e9aa8;font-size:13px;letter-spacing:.3em}
    #loadMask.on{display:flex}
    #loadMask .bar{width:180px;height:2px;background:rgba(255,255,255,.10);overflow:hidden}
    #loadMask .bar i{display:block;height:100%;width:40%;background:#7f93a6;animation:lmove 1.1s ease-in-out infinite}
    @keyframes lmove{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
</style>
</head>
<body>
<div id="hud">WASD 移动 · Shift 加速 · 空格 跳跃 · F 手电 · E 交互 · 左键 扔墨水 · P 鬼视角 · Esc 设置</div>
<div id="stam"><i></i></div>
<div id="stamAI"><i></i></div>
<div id="fps"></div>
<div id="xhair"></div>
<div id="redview"></div>
<div id="blind"></div>
<div id="prompt"></div>
<div id="items"></div>
<div id="ghostTag">鬼 视 角</div>
<div id="ui"><div class="box">
  <h1 id="uiTitle">走 廊</h1>

  <div class="view on" id="pMain">
    <button class="btn primary" id="btnStart">开始游戏</button>
    <button class="btn" id="btnSettings" data-i18n="settings">设置</button>
    <button class="btn" id="btnControls" data-i18n="controls">按键说明</button>
    <button class="btn" id="btnSkin" data-i18n="skin">皮肤</button>
    <button class="btn" id="btnLang">English</button>
    <button class="btn quit" id="btnQuit" data-i18n="quit">退出游戏</button>
  </div>

  <div class="view" id="pMode">
    <h2>游戏模式</h2>
    <div class="campRow">
      <button class="campPick" id="pickSingle">单人模式<small>另一侧由 AI 控制</small></button>
      <button class="campPick" id="pickMulti">多人模式<small>4 人联机（开发中）</small></button>
    </div>
    <div class="hint">单人：你当人 → 鬼由 AI 追击；你当鬼 → 4 个 AI 人类躲藏</div>
    <button class="btn back" data-back="1">返回</button>
  </div>

  <div class="view" id="pCamp">
    <h2>选择阵营</h2>
    <div class="campRow">
      <button class="campPick" id="pickHuman">我当人类<small>找出口 · 能躲门后</small></button>
      <button class="campPick" id="pickGhost">我当鬼<small>追 4 个 AI 人类 · 刀人</small></button>
    </div>
    <div class="hint">鬼只能有 1 个 · 一局最多 6 人</div>
    <button class="btn back" data-back="1">返回</button>
  </div>

  <div class="view" id="pSettings">
    <h2 data-i18n="settings">设置</h2>
    <div class="set">
      <label><span data-i18n="sens">鼠标灵敏度</span>　<b id="sensV">1.00</b>×
        <input id="sens" type="range" min="0.2" max="3" step="0.05" value="1">
      </label>
      <label><span data-i18n="vol">音量</span>　<b id="volV">60</b>%
        <input id="vol" type="range" min="0" max="100" step="1" value="60">
      </label>
      <label><span data-i18n="xhair">准心透明度</span>　<b id="xhV">25</b>%
        <input id="xh" type="range" min="0" max="100" step="1" value="25">
      </label>
      <label><span data-i18n="qual">画质</span>
        <select id="qual">
          <option value="0" data-i18n="q0">低（流畅）</option>
          <option value="1" data-i18n="q1">中（推荐）</option>
          <option value="2" data-i18n="q2">高（清晰）</option>
        </select>
      </label>
      <div class="gpu" id="gpuLine">—</div>
      <div class="hint" data-i18n="hint">调完点「返回」，再点「开始游戏」</div>
    </div>
    <button class="btn back" data-back="1" data-i18n="back">返回</button>
  </div>

  <div class="view" id="pControls">
    <h2 data-i18n="controls">说明</h2>
    <div class="ctlWrap">
      <div class="ctlBox">
        <div class="ctlWho">人类</div>
        <div id="keyListHuman"></div>
      </div>
      <div class="ctlBox">
        <div class="ctlWho red">鬼</div>
        <div id="keyListGhost"></div>
      </div>
      <div class="ctlBox verBox">
        <div class="ctlTitle">版本</div>
        <div id="verLine"></div>
      </div>
    </div>
    <button class="btn back" data-back="1" data-i18n="back">返回</button>
  </div>

  <div class="view" id="pSkin">
    <h2 data-i18n="skin">皮肤</h2>
    <canvas id="skinPrev" width="200" height="250"></canvas>
    <div class="sw" id="swatches"></div>
    <div class="hint" data-i18n="skinHint">联机时，其他玩家看到的就是这个颜色</div>
    <button class="btn back" data-back="1" data-i18n="back">返回</button>
  </div>

  <div class="foot">v3.0 · 单人 AI + 肉鸽 + 抽屉 · 4 人联机筹备中</div>

  <div class="view" id="pWin">
    <h2 id="winTitle">你逃出去了</h2>
    <p class="hint" id="winHint">按下面的按钮重新开始</p>
    <button class="btn primary" onclick="location.reload()" id="winBtn">再来一次</button>
  </div>

  <div class="view" id="pBye">
    <h2 data-i18n="bye">可以关掉这个标签页了</h2>
    <button class="btn" data-back="1">返回</button>
  </div>
</div>
<div id="loadMask"><div>加 载 中</div><div class="bar"><i></i></div></div></div>
<script src="three.global.js"></script>
<script src="config.js"></script>
<script src="level.js"></script>
<script src="game.js"></script>
</body>
</html>
