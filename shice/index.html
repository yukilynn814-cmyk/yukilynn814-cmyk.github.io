<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EF">
<title>食策 · 免费开源饮食助手</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg-base:#F7F4EF; --bg-card:#FFFFFF; --bg-field:#F0ECE5; --bg-hover:#E9E4DB;
  --text-hi:#231D15; --text-md:#6E6559; --text-lo:#A79D8F;
  --brand:#E07B39; --brand-strong:#C9681F; --brand-soft:rgba(224,123,57,.13);
  --lv-low:#3E9B55; --lv-mid:#D99A2B; --lv-high:#D9534F;
  --line:rgba(35,29,21,.10); --line-strong:rgba(35,29,21,.20);
  --glow:0 8px 24px rgba(80,55,20,.10);
  --icon:#9A7B5C;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --fs-title:22px; --fs-body:15px; --fs-small:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg-base); color:var(--text-hi);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:var(--fs-body); line-height:1.5;
}
.app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 20px 40px;position:relative}

.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:16px 4px 12px;background:linear-gradient(var(--bg-base) 70%,rgba(247,244,239,0));
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .logo{font-size:20px;font-weight:800;letter-spacing:.5px}
.brand .logo b{color:var(--brand)}
.brand .sub{font-size:11px;color:var(--text-lo);letter-spacing:1px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg-card);color:var(--text-md);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:var(--bg-hover)}

.screen{display:none;animation:in .28s ease}
.screen.active{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.sub-nav{display:flex;align-items:center;gap:8px;margin:4px 0 16px}
.sub-nav button{border:none;background:none;color:var(--text-md);font-size:14px;cursor:pointer;padding:6px 10px 6px 0}

h1.title{font-size:var(--fs-title);font-weight:700;margin:6px 0 18px}
.greeting{font-size:20px;font-weight:700;margin:8px 0 20px;line-height:1.4}
.greeting small{display:block;font-size:13px;font-weight:400;color:var(--text-lo);margin-top:4px}
.section-title{font-size:12px;color:var(--text-lo);letter-spacing:1px;margin:26px 0 12px}

.mode-card{
  display:flex;align-items:center;gap:16px;padding:20px 18px;margin-bottom:14px;
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);
  cursor:pointer;transition:transform .15s,border-color .15s;
}
.mode-card:active{transform:scale(.98)}
.mode-card:hover{border-color:var(--line-strong)}
.mode-icon{width:52px;height:52px;border-radius:16px;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--brand)}
.mode-icon svg{width:28px;height:28px}
.mode-text{flex:1}
.mode-text h2{font-size:17px;font-weight:700}
.mode-text p{font-size:13px;color:var(--text-md);margin-top:2px}
.chevron{color:var(--text-lo);font-size:22px}

.today-card{display:flex;align-items:center;gap:14px;padding:16px 18px;background:linear-gradient(160deg,#FFF4E8,#FFFFFF);border:1px solid var(--brand-soft);border-radius:var(--r-l);margin-bottom:14px;cursor:pointer}
.today-card .tc-num{font-size:30px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.today-card .tc-num small{font-size:13px;font-weight:400;color:var(--text-lo)}
.today-card .tc-body{flex:1}
.today-card .tc-body .t1{font-size:14px;font-weight:600}
.today-card .tc-body .t2{font-size:12px;color:var(--text-lo);margin-top:2px}

.empty-tip{color:var(--text-lo);font-size:13px;padding:16px;text-align:center;border:1px dashed var(--line);border-radius:var(--r-m)}

.stepper{display:flex;align-items:center;gap:8px;margin:6px 0 24px}
.stepper .step{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-lo);background:var(--bg-field);border:1px solid var(--line);flex-shrink:0}
.stepper .step.done{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.stepper .step.now{background:var(--brand);color:#fff;border-color:var(--brand)}
.stepper .bar{flex:1;height:2px;background:var(--line);border-radius:1px}
.stepper .bar.done{background:var(--brand)}
.step-question{font-size:19px;font-weight:700;margin-bottom:20px}

.option-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.option-grid.cols3{grid-template-columns:repeat(3,1fr)}
.option{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;background:var(--bg-field);border:1.5px solid var(--line);border-radius:var(--r-m);color:var(--text-md);cursor:pointer;transition:.15s}
.option:active{transform:scale(.97)}
.option .opt-icon{width:34px;height:34px;color:var(--icon);display:flex;align-items:center;justify-content:center}
.option .opt-icon svg{width:34px;height:34px}
.option .opt-label{font-size:15px;font-weight:600;color:var(--text-hi)}
.option .opt-desc{font-size:11px;color:var(--text-lo)}
.option.sel{background:var(--brand-soft);border-color:var(--brand)}
.option.sel .opt-icon{color:var(--brand)}
.option.sel .opt-label{color:var(--brand-strong)}
.option.sel .opt-desc{color:var(--brand)}

.wizard-nav{display:flex;gap:12px;margin-top:30px}
.btn{flex:1;padding:15px 0;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;border:none;transition:.15s}
.btn:active{transform:scale(.97)}
.btn--primary{background:linear-gradient(135deg,var(--brand),var(--brand-strong));color:#fff;box-shadow:0 8px 20px rgba(224,123,57,.25)}
.btn--ghost{background:var(--bg-field);color:var(--text-md);border:1px solid var(--line)}
.btn--block{display:block;width:100%;margin-top:16px}

.result-hero{background:linear-gradient(160deg,#FFF4E8,#FFFFFF);border:1px solid var(--brand-soft);border-radius:var(--r-l);padding:28px 22px;margin-bottom:16px;text-align:center}
.badge{display:inline-block;font-size:11px;color:var(--brand);background:var(--brand-soft);padding:4px 12px;border-radius:20px;letter-spacing:1px;margin-bottom:14px}
.result-hero h2{font-size:22px;font-weight:800;margin-bottom:8px}
.result-hero .rh-reason{font-size:13px;color:var(--text-md);line-height:1.6}
.match-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.match-tag{font-size:12px;padding:5px 12px;border-radius:14px;background:var(--bg-field);border:1px solid var(--line);color:var(--text-md)}
.match-tag.hit{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}

.kcal-box{background:var(--bg-field);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;margin:14px 0}
.kcal-title{font-size:12px;color:var(--text-lo);letter-spacing:1px;margin-bottom:8px}
.kcal-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
.kcal-row .k-name{color:var(--text-md)}
.kcal-row .k-grams{color:var(--text-lo);font-size:12px;margin-left:8px}
.kcal-row .k-val{color:var(--text-hi);font-weight:600;font-variant-numeric:tabular-nums}
.kcal-sub{display:flex;justify-content:space-between;border-top:1px dashed var(--line);margin-top:8px;padding-top:10px;font-weight:700;font-size:15px}

.alt-title{font-size:13px;color:var(--text-lo);margin:22px 0 10px}
.alt-list{display:flex;flex-direction:column;gap:10px}
.alt-item{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);cursor:pointer;transition:.15s}
.alt-item:active{transform:scale(.98)}
.alt-item .a-body{flex:1}
.alt-item .a-name{font-size:15px;font-weight:600}
.alt-item .a-diff{font-size:11px;color:var(--brand)}

.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick-opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;background:var(--bg-field);border:1.5px solid var(--line);border-radius:var(--r-s);cursor:pointer;text-align:center;transition:.15s}
.pick-opt:active{transform:scale(.95)}
.pick-opt .p-name{font-size:12px;font-weight:600;color:var(--text-hi)}
.pick-opt .p-meta{font-size:10px;color:var(--text-lo);line-height:1.3}
.pick-opt.sel{background:var(--brand-soft);border-color:var(--brand)}
.pick-opt.sel .p-name{color:var(--brand-strong)}
.pick-opt.sel .p-meta{color:var(--brand)}

.summary-panel{margin-top:22px;padding:20px 18px;border-radius:var(--r-l);background:linear-gradient(160deg,#FFF6EC,#FFFFFF);border:1px solid var(--line-strong);box-shadow:var(--glow)}
.summary-panel .s-total{display:flex;align-items:baseline;justify-content:space-between}
.summary-panel .s-total .lbl{font-size:13px;color:var(--text-md)}
.summary-panel .s-total .num{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text-hi)}
.summary-panel .s-total .num small{font-size:14px;font-weight:400;color:var(--text-lo);margin-left:4px}
.rate-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;letter-spacing:.5px}
.s-break{font-size:12px;color:var(--text-lo);margin-top:10px;line-height:1.7}

.location-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:16px;font-size:13px}
.location-bar .loc-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.location-bar .loc-dot.on{background:var(--brand);box-shadow:0 0 8px var(--brand)}
.location-bar .loc-dot.wait{background:var(--lv-mid)}
.location-bar .loc-dot.off{background:var(--lv-high)}
.location-bar .loc-text{flex:1;color:var(--text-md)}
.location-bar .loc-note{font-size:11px;color:var(--lv-mid)}

.group-label{font-size:12px;color:var(--text-lo);letter-spacing:1px;margin:18px 0 10px}
.store-card{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:10px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m)}
.store-card.best{border-color:var(--brand);background:linear-gradient(160deg,#FDF0E0,#FFFFFF)}
.store-rank{width:30px;height:30px;border-radius:10px;background:var(--bg-field);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--text-md);flex-shrink:0}
.store-card.best .store-rank{background:var(--brand);color:#fff}
.store-body{flex:1;min-width:0}
.store-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.best-tag{font-size:10px;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:10px}
.store-addr{font-size:11px;color:var(--text-lo);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.store-side{text-align:right;flex-shrink:0}
.store-dist{font-size:14px;font-weight:700;color:var(--brand)}
.store-rate{font-size:11px;color:var(--lv-mid);margin-top:3px}

.meal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.meal{padding:12px 0;background:var(--bg-field);border:1.5px solid var(--line);border-radius:var(--r-m);color:var(--text-md);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;position:relative}
.meal:active{transform:scale(.95)}
.meal.sel{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong)}
.meal .meal-dot{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.meal:not(.picked) .meal-dot{display:none}

.slot-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:40px 24px;margin-bottom:20px;display:flex;flex-direction:column;align-items:center;min-height:180px;justify-content:center;text-align:center}
.slot-hint{color:var(--text-lo);font-size:13px;margin-bottom:16px}
.slot-name{font-size:30px;font-weight:800;letter-spacing:1px;min-height:40px}
.slot-card.result .slot-name{color:var(--brand);animation:pop .4s ease}
.slot-tag{margin-top:12px;font-size:12px;color:var(--brand);background:var(--brand-soft);padding:4px 14px;border-radius:14px;display:none}
.slot-card.result .slot-tag{display:inline-block}
.slot-detail{display:none;margin-top:12px;font-size:12px;color:var(--text-lo);line-height:1.7;border-top:1px dashed var(--line);padding-top:12px;width:100%}
.slot-card.result .slot-detail{display:block}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.day-row{display:flex;align-items:center;gap:8px;padding:11px 12px;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:8px;font-size:14px;overflow:hidden}
.day-row .dr-thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--bg-hover)}
.day-row .dr-meal{color:var(--text-lo);font-size:12px;flex-shrink:0;width:32px}
.day-row .dr-name{flex:1;min-width:0;color:var(--text-hi);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-row .dr-kcal{color:var(--brand);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0}
.dr-act{font-size:11px;color:var(--text-md);background:var(--bg-field);padding:3px 8px;border-radius:10px;cursor:pointer;flex-shrink:0}
.day-total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin-top:12px;background:linear-gradient(160deg,#FFF4E8,#FFFFFF);border:1px solid var(--brand-soft);border-radius:var(--r-m);font-size:14px;font-weight:600}
.day-total b{font-size:22px;color:var(--brand);font-variant-numeric:tabular-nums}

.log-day{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--r-l);padding:16px 18px;margin-bottom:14px}
.log-day .ld-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.log-day .ld-date{font-size:15px;font-weight:700}
.log-day .ld-total{font-size:14px;color:var(--brand);font-weight:700;font-variant-numeric:tabular-nums}
.log-day .ld-del{font-size:12px;color:var(--lv-high);cursor:pointer;margin-left:12px}
.log-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.log-item .li-name{flex:1;color:var(--text-hi)}
.log-item .li-meal{color:var(--text-lo);font-size:11px;background:var(--bg-field);padding:2px 8px;border-radius:10px}
.log-item .li-kcal{color:var(--text-md);font-weight:600;font-variant-numeric:tabular-nums}
.log-item .li-del{color:var(--lv-high);font-size:12px;cursor:pointer;padding-left:8px}


/* 实拍菜品图 */
.opt-photo{width:100%;height:76px;object-fit:cover;border-radius:10px;display:block;background:var(--bg-hover)}
.option.sel .opt-photo{border:1.5px solid var(--brand)}
.hero-photo{width:100%;max-width:240px;aspect-ratio:1/1;object-fit:cover;border-radius:18px;margin:0 auto 16px;display:block;box-shadow:var(--glow)}
.alt-item .a-thumb{width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--bg-hover)}
.slot-photo{width:148px;height:148px;object-fit:cover;border-radius:16px;margin-bottom:14px;display:none;box-shadow:var(--glow)}
.slot-card.result .slot-photo{display:block}


/* 饮品/汤品 小角标 */
.pick-tag{display:inline-block;font-size:9px;line-height:1;padding:3px 6px;border-radius:8px;font-weight:700;letter-spacing:.3px;vertical-align:middle}
.pick-opt .p-head{display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap;width:100%}
.pick-opt .p-name{font-size:12px;font-weight:600;color:var(--text-hi);text-align:center;line-height:1.25}
.pick-opt.sel .p-tag{filter:saturate(1.2)}
.pick-grid.sugar-group{grid-template-columns:repeat(2,1fr);margin-bottom:14px}
.group-cap{font-size:11px;color:var(--text-lo);margin:0 0 7px 2px;letter-spacing:.5px}
.group-cap b{color:var(--text-md);font-weight:600}


/* 已抽中的餐段在标签上显示菜名 */
.meal .meal-name{display:block;font-size:10px;font-weight:400;color:var(--text-lo);margin-top:2px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal.sel .meal-name{color:var(--brand-strong)}
.meal.picked .meal-name{color:var(--text-md)}
.slot-saved{display:none;margin-top:8px;font-size:11px;color:var(--brand);background:var(--brand-soft);padding:4px 12px;border-radius:12px}
.slot-card.saved .slot-saved{display:inline-block}
.day-row{cursor:pointer}
.day-row.active{border-color:var(--brand);background:linear-gradient(160deg,#FFF6EC,#FFFFFF)}
.row-reset-note{font-size:11px;color:var(--text-lo);text-align:center;margin-top:8px}


/* 确认弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(20,15,10,.45);display:flex;align-items:center;justify-content:center;padding:24px;z-index:200;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-card);border-radius:var(--r-l);padding:22px 20px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s ease}
.modal h3{font-size:17px;font-weight:700;margin-bottom:10px}
.modal .m-body{font-size:13px;color:var(--text-md);line-height:1.75;white-space:pre-line}
.modal .m-list{margin:10px 0 4px;padding-left:18px;font-size:13px;color:var(--text-md);line-height:1.85}
.modal .m-list li{margin-bottom:2px}
.modal .m-note{font-size:11px;color:var(--text-lo);margin-top:10px}
.modal-btns{display:flex;gap:10px;margin-top:18px}
.modal-btns .btn{padding:13px 0;font-size:15px}
.modal-btns .btn--danger{background:linear-gradient(135deg,#E06459,#C94A3F);color:#fff}


/* 向导选项：实拍照片卡片 */
.option.has-photo{padding:0;overflow:hidden;background:var(--bg-card);border:1.5px solid var(--line)}
.option.has-photo .opt-photo{width:100%;height:104px;object-fit:cover;display:block;background:var(--bg-hover);border-bottom:1px solid var(--line)}
.option.has-photo .opt-text{padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.option.has-photo.sel{border-color:var(--brand);background:var(--brand-soft)}
.option.has-photo.sel .opt-photo{border-bottom-color:var(--brand)}
.option.has-photo.sel .opt-text{background:var(--brand-soft)}
.option.has-photo .opt-label{font-size:14px;font-weight:600;color:var(--text-hi)}
.option.has-photo.sel .opt-label{color:var(--brand-strong)}
.option.has-photo .opt-desc{font-size:10.5px;color:var(--text-lo);line-height:1.35}
.option.has-photo.sel .opt-desc{color:var(--brand)}
.option-grid.cols2 .option.has-photo .opt-photo{height:96px}

.foot{text-align:center;color:var(--text-lo);font-size:11px;margin-top:36px;letter-spacing:.5px}
.foot a{color:var(--text-md)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">食<b>策</b></span>
      <span class="sub">免费开源 · 饮食助手</span>
    </div>
    <button class="icon-btn" id="btn-settings" title="设置">⚙</button>
  </header>

  <section class="screen active" id="screen-home">
    <div class="greeting" id="greeting">今天想吃点什么？<small>两个入口，慢慢选</small></div>
    <div class="mode-card" id="card-wizard">
      <div class="mode-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></div>
      <div class="mode-text"><h2>精准控制</h2><p>按热量·主食·口味·口感，一步步定下来</p></div>

function autoMeal(){
  const h = new Date().getHours();
  if (h>=5 && h<10) return 'breakfast';
  if (h>=10 && h<16) return 'lunch';
  if (h>=16 && h<21) return 'dinner';
  return 'supper';
}

const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-'+id).classList.add('active');
  window.scrollTo(0,0);
}
function nowStr(){
  const d = new Date(), p = n => (n<10?'0'+n:''+n);
  return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function mealLabel(k){ const m = MEALS.find(x=>x.key===k); return m?m.label:k; }
function todayKey(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function readLog(){ try { return JSON.parse(localStorage.getItem('shice_dietlog')||'{}'); } catch(e){ return {}; } }
function writeLog(log){ try { localStorage.setItem('shice_dietlog', JSON.stringify(log)); } catch(e){} }
function addLogItem(item){
  const log = readLog(); const k = todayKey();
  if (!log[k]) log[k] = [];
  log[k].push({ name:item.name, kcal:item.kcal||0, meal:item.meal||'', mode:item.mode||'', time:nowStr() });
  writeLog(log);
}
function deleteLogItem(day, idx){
  const log = readLog();
  if (log[day]){ log[day].splice(idx,1); if (!log[day].length) delete log[day]; writeLog(log); }
}
function deleteLogDay(day){ const log = readLog(); delete log[day]; writeLog(log); }
function dayTotal(items){ return (items||[]).reduce((s,i)=>s+(i.kcal||0),0); }
function dateLabel(k){
  const t = todayKey();
  if (k===t) return '今天';
  const y = new Date(); y.setDate(y.getDate()-1);
  const p = n => String(n).padStart(2,'0');
  const yk = y.getFullYear()+'-'+p(y.getMonth()+1)+'-'+p(y.getDate());
  if (k===yk) return '昨天';
  return k;
}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb = 'cb_'+Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('网络请求失败')); };
    function cleanup(){ try{ delete window[cb]; }catch(e){} s.remove(); }
    s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
    document.body.appendChild(s);
    setTimeout(()=>{ if(window[cb]){ cleanup(); reject(new Error('请求超时')); } }, 8000);
  });
}

function startWizard(){ state.wizard = { step:0, answers:{} }; state.pick = { drink:'none', soup:'none' }; renderWizard(); showScreen('wizard'); }
function renderWizard(){
  const i = state.wizard.step, step = STEPS[i];
  let bar = '';
  for (let k=0;k<STEPS.length;k++){
    if (k>0) bar += '<span class="bar '+(k<=i?'done':'')+'"></span>';
    const cls = k<i?'done':(k===i?'now':'');
    bar += '<span class="step '+cls+'">'+(k<i?'✓':(k+1))+'</span>';
  }
  $('stepper').innerHTML = bar;
  $('step-question').textContent = step.question;
  $('option-grid').className = 'option-grid' + (step.cols===3 ? ' cols3' : '');
  $('option-grid').innerHTML = step.options.map(o => {
    const sel = state.wizard.answers[step.key]===o.id ? ' sel' : '';
    if (o.img){
      return '<div class="option has-photo'+sel+'" data-id="'+o.id+'">' +
        '<img class="opt-photo" src="'+imgUrl(o.img)+'" alt="'+o.label+'" ' +
        'onerror="var p=this; p.style.display=\'none\'; p.parentNode.classList.remove(\'has-photo\');">' +
        '<span class="opt-text">' +
          '<span class="opt-label">'+o.label+'</span>' +
          (o.desc?'<span class="opt-desc">'+o.desc+'</span>':'') +
        '</span>' +
      '</div>';
    }
    return '<div class="option'+sel+'" data-id="'+o.id+'">' +
      '<span class="opt-icon">'+(ICONS[o.icon]||'')+'</span>' +
      '<span class="opt-label">'+o.label+'</span>' +
      (o.desc?'<span class="opt-desc">'+o.desc+'</span>':'') +
    '</div>';
  }).join('');
  $('option-grid').querySelectorAll('.option').forEach(el => {
    el.onclick = () => { state.wizard.answers[step.key] = el.dataset.id; renderWizard(); };
  });
  const canNext = !!state.wizard.answers[step.key];
  $('wizard-nav').innerHTML =
    '<button class="btn btn--ghost" id="btn-prev" '+(i===0?'disabled style="opacity:.4"':'')+'>上一步</button>' +
    '<button class="btn btn--primary" id="btn-next" '+(canNext?'':'disabled style="opacity:.4"')+'>下一步</button>';
  $('btn-prev').onclick = prevStep;
  $('btn-next').onclick = nextStep;
}
function nextStep(){
  const i = state.wizard.step;
  if (!state.wizard.answers[STEPS[i].key]) return;
  if (i < STEPS.length-1){ state.wizard.step++; renderWizard(); }
  else finishWizard();
}
function prevStep(){ if (state.wizard.step>0){ state.wizard.step--; renderWizard(); } }
function finishWizard(){
  if (state.wizard.answers.dining === 'takeout'){ showTakeout(); }
  else { showDinein(); }
}

function scoreDishes(){
  const a = state.wizard.answers;
  return DISHES
    .filter(d => d.meals.includes(state.meal))
    .map(d => {
      let s = 0;
      if (d.cal===a.cal) s++;
      if (d.staple===a.staple) s++;
      if (d.spicy===a.spicy) s++;
      if (d.texture===a.texture) s++;
      return { ...d, s };
    })
    .sort((x,y)=> y.s - x.s);
}
function showDinein(){
  const list = scoreDishes();
  if (!list.length){
    $('dinein-result').innerHTML = '<div class="empty-tip">当前餐段没有匹配的菜品，换个条件试试</div>';
    showScreen('dinein'); return;
  }
  state.dineinAll = list;
  state.dineinMain = list[0];
  state.dineinAlts = list.slice(1,4);
  renderDinein();
  showScreen('dinein');
}

}

function renderDinein(){
  const main = state.dineinMain;
  if (!main) return;
  const a = state.wizard.answers;
  const dims = [
    { label:'热量', val:CAL_LABEL[main.cal], hit: main.cal===a.cal },
    { label:'主食', val:STAPLE_LABEL[main.staple], hit: main.staple===a.staple },
    { label:'口味', val:SPICY_LABEL[main.spicy], hit: main.spicy===a.spicy },
    { label:'口感', val:TEXTURE_LABEL[main.texture], hit: main.texture===a.texture }
  ];
  const tags = dims.map(d =>
    '<span class="match-tag '+(d.hit?'hit':'')+'">'+(d.hit?'✓ ':'✗ ')+d.label+'·'+d.val+'</span>'
  ).join('');

  const dishKcal = main.parts.reduce((s,p)=>s+p.kcal,0);
  const drink = DRINKS.find(x=>x.id===state.pick.drink) || DRINKS[0];
  const soup = SOUPS.find(x=>x.id===state.pick.soup) || SOUPS[0];
  const total = dishKcal + drink.kcal + soup.kcal;
  const rate = rateMeal(total);

  const hero =
    '<div class="result-hero">' +
      '<span class="badge">堂食搭配 · 命中 '+main.s+'/4 项</span>' +
      '<img class="hero-photo" src="'+dishImg(main.name)+'" alt="'+esc(main.name)+'" onerror="this.style.display=\'none\'">' +
      '<h2>'+esc(main.combo)+'</h2>' +
      '<p class="rh-reason">'+esc(main.desc)+'</p>' +
      '<div class="match-tags">'+tags+'</div>' +
    '</div>';

  const kcalBox =
    '<div class="kcal-box"><div class="kcal-title">热量明细 · 建议份量</div>' +
    main.parts.map(p =>
      '<div class="kcal-row"><span class="k-name">'+esc(p.name)+'<span class="k-grams">'+esc(p.grams)+'</span></span><span class="k-val">'+p.kcal+' 大卡</span></div>'
    ).join('') +
    '<div class="kcal-sub"><span>饭菜小计</span><span>'+dishKcal+' 大卡</span></div></div>';

  const altHtml = state.dineinAlts.length
    ? '<div class="alt-title">换个口味试试（按匹配度排序，非随机）</div><div class="alt-list">' +
      state.dineinAlts.map((d,i)=> '<div class="alt-item" data-i="'+i+'">' +
        '<img class="a-thumb" src="'+dishImg(d.name)+'" alt="" onerror="this.style.display=\'none\'">' +
        '<div class="a-body"><div class="a-name">'+esc(d.combo)+'</div>' +
        '<div class="a-diff">'+SPICY_LABEL[d.spicy]+' · '+TEXTURE_LABEL[d.texture]+' · '+CAL_LABEL[d.cal]+'</div></div>' +
        '<span class="chevron">›</span></div>').join('') +
      '</div>'
    : '<div class="alt-title">暂时没有更接近的备选了</div>';

  const extras = [];
  if (drink.id!=='none') extras.push(drink.name+(drink.sugar==='sugar'?'(含糖)':(drink.sugar==='zero'?'(无糖)':''))+' '+drink.kcal);
  if (soup.id!=='none') extras.push(soup.name+' '+soup.kcal);
  const breakdown = main.parts.map(p=>p.name+' '+p.kcal).join(' + ') +
    (extras.length ? ' + '+extras.join(' + ') : '') + ' = '+total+' 大卡';

  const summary =
    '<div class="summary-panel">' +
      '<div class="s-total"><span class="lbl">总热量</span><span class="num">'+total+'<small>大卡</small></span></div>' +
      '<div style="margin-top:10px"><span class="rate-badge" style="color:'+rate.c+';background:'+rate.bg+'">'+rate.label+' · '+rate.en+'</span></div>' +
      '<div class="s-break">'+esc(breakdown)+'</div>' +
    '</div>';

  $('dinein-result').innerHTML =
    hero + kcalBox + altHtml +
    '<div class="section-title">加份饮品（可跳过，默认不喝）</div>' + renderDrinkGrid(state.pick.drink) +
    '<div class="section-title">加份汤（可跳过，默认不加）</div>' + renderSoupGrid(state.pick.soup) +
    summary +
    '<button class="btn btn--primary btn--block" id="btn-save-meal">记下这顿</button>' +
    '<button class="btn btn--ghost btn--block" id="btn-edit">返回修改</button>';

  $('btn-save-meal').onclick = () => {
    const name = main.combo + (drink.id!=='none'?' + '+drink.name:'') + (soup.id!=='none'?' + '+soup.name:'');
    addLogItem({ name:name, kcal:total, meal:mealLabel(state.meal), mode:'手动' });
    renderHome();
    toast('已记入今日记录');
  };
  $('btn-edit').onclick = () => { state.wizard.step = STEPS.length-1; renderWizard(); showScreen('wizard'); };
  $('dinein-result').querySelectorAll('.alt-item').forEach(el => {
    el.onclick = () => pickAlt(+el.dataset.i);
  });
  $('dinein-result').querySelectorAll('[data-drink]').forEach(el => {
    el.onclick = () => { state.pick.drink = el.dataset.drink; renderDinein(); };
  });
  $('dinein-result').querySelectorAll('[data-soup]').forEach(el => {
    el.onclick = () => { state.pick.soup = el.dataset.soup; renderDinein(); };
  });
}
/* 确认弹窗：说明「做什么 / 动什么 / 影响范围」后再让用户决定 */
function confirmModal(title, bullets, note, okText){
  return new Promise(resolve => {
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML =
      '<div class="modal">' +
        '<h3>'+esc(title)+'</h3>' +
        (bullets && bullets.length ? '<ul class="m-list">'+bullets.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul>' : '') +
        (note ? '<div class="m-note">'+esc(note)+'</div>' : '') +
        '<div class="modal-btns">' +
          '<button class="btn btn--ghost" data-x="0">取消</button>' +
          '<button class="btn btn--danger" data-x="1">'+esc(okText||'确定')+'</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    function done(v){
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      resolve(v);
    }
    mask.querySelectorAll('[data-x]').forEach(b => {
      b.onclick = () => done(b.dataset.x === '1');
    });
    mask.onclick = e => { if (e.target === mask) done(false); };
  });
}

function toast(msg){
  try {
    const old = document.getElementById('__toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.id = '__toast';
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#231D15;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:99;opacity:.95;transition:opacity .3s';
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 1600);
  } catch(e){}
}

function setLocBar(status, text, note){
  const dot = status==='on'?'on':(status==='wait'?'wait':'off');
  $('location-bar').innerHTML =
    '<span class="loc-dot '+dot+'"></span>' +
    '<span class="loc-text">'+esc(text)+'</span>' +
    (note?'<span class="loc-note">'+esc(note)+'</span>':'');
}
function keywordFromAnswers(){
  const a = state.wizard.answers, parts=[];
  if (a.spicy==='hot') parts.push('火锅','川菜');
  else if (a.spicy==='mid') parts.push('川菜','湘菜');
  else if (a.spicy==='mild') parts.push('麻辣烫','香锅');
  else if (a.spicy==='none') parts.push('粤菜','江浙菜');
  if (a.cal==='low') parts.push('轻食','沙拉');
  if (a.staple==='noodle') parts.push('面馆','米线');
  else if (a.staple==='dumpling') parts.push('饺子','包子');
  else if (a.staple==='rice') parts.push('盖浇饭','快餐');
  if (a.texture==='soup') parts.push('汤','粥');
  if (!parts.length) parts.push('餐厅');
  return parts.join('|');
}
async function showTakeout(){
  showScreen('takeout');
  setLocBar('wait', '正在定位…');
  $('store-list').innerHTML = '';
  if (!KEY()){ setLocBar('off', '未配置高德密钥', '显示演示数据'); renderStores(mockRanked(), true); return; }
  setLocBar('off', '高德密钥已配置，但本演示版暂用本地数据', '演示数据');
  renderStores(mockRanked(), true);
}
function mockRanked(){
  const a = state.wizard.answers;
  return MOCK_STORES.map(s => {
    let sc = 0;
    if (s.spicy===a.spicy) sc += 2;
    if (s.cal===a.cal) sc += 1;
    return { name:s.name, addr:'演示地址', dist:s.dist, rate:s.rate, mock:true, sc };
  }).sort((x,y)=> (y.sc-x.sc) || x.dist-y.dist);
}
function renderStores(stores, isMock){
  const bestIdx = stores.length ? ((stores[0].kw || (isMock && stores[0].sc>0)) ? 0 : -1) : -1;
  $('store-list').innerHTML =
    (isMock?'<div class="group-label">⚠ 演示数据 · 后续接高德地图显示真实附近店铺</div>':'') +
    '<div class="group-label">'+(bestIdx>=0?'✓ 符合你的筛选':'附近店铺（按距离排序）')+'</div>' +
    stores.map((s,i) =>
      '<div class="store-card '+(i===bestIdx?'best':'')+'">' +
        '<div class="store-rank">'+(i+1)+'</div>' +
        '<div class="store-body">' +
          '<div class="store-name">'+esc(s.name)+(i===bestIdx?'<span class="best-tag">最符合</span>':'')+'</div>' +
          '<div class="store-addr">'+esc(s.addr||'')+'</div>' +
        '</div>' +
        '<div class="store-side">' +
          '<div class="store-dist">'+ (s.dist>=1000 ? (s.dist/1000).toFixed(1)+'km' : s.dist+'m') +'</div>' +
          '<div class="store-rate">'+(s.rate?('★ '+s.rate):'暂无评分')+'</div>' +
        '</div>' +
      '</div>'
    ).join('');
}

function startRandom(){ renderMealGrid(); renderSlot(); renderDayPlan(); showScreen('random'); }
function renderMealGrid(){
  $('meal-grid').innerHTML = MEALS.map(m => {
    const pick = state.dayPlan[m.key];
    return '<button class="meal '+(m.key===state.meal?'sel':'')+(pick?' picked':'')+'" data-key="'+m.key+'" ' +
      'title="'+(pick?esc(pick.name):m.label)+'">' +
      m.label + '<span class="meal-name">'+(pick?esc(pick.name):'')+'</span>' +
      '<span class="meal-dot"></span></button>';
  }).join('');
  $('meal-grid').querySelectorAll('.meal').forEach(el => {
    el.onclick = () => { state.meal = el.dataset.key; renderMealGrid(); renderSlot(); };
  });
}
/* 抽卡区：显示当前餐段的结果。
   已抽过的餐段 → 显示已保存的图片/菜名/热量，按钮变「重新抽这一餐」；
   没抽过的餐段 → 显示 ? 和「抽这一餐」。 */
function renderSlot(){
  const pick = state.dayPlan[state.meal];
  const card = $('slot-card');
  if (!pick){
    card.classList.remove('result','saved');
    $('slot-photo').src = '';
    $('slot-name').textContent = '?';
    $('slot-hint').textContent = '选一餐，点下面按钮抽';
    $('slot-tag').textContent = '';
    $('slot-detail').innerHTML = '';
    $('btn-roll').textContent = '抽这一餐';
    $('btn-roll').disabled = false;
    return;
  }
  const totalKcal = pick.parts.reduce((s,p)=>s+p.kcal,0);
  card.classList.add('result','saved');
  $('slot-photo').src = dishImg(pick.name);
  $('slot-name').textContent = pick.name;
  $('slot-tag').textContent = mealLabel(state.meal)+' · '+SPICY_LABEL[pick.spicy]+' · 共 '+totalKcal+' 大卡';
  $('slot-detail').innerHTML = pick.parts.map(pt => esc(pt.name)+' '+esc(pt.grams)+' '+pt.kcal+'大卡').join(' · ');
  $('slot-hint').textContent = '这一餐已经抽好了';
  $('btn-roll').textContent = '重新抽这一餐';
  $('btn-roll').disabled = false;
}
function renderDayPlan(){
  const rows = MEALS.map(m => {
    const pick = state.dayPlan[m.key];
    const kcal = pick ? pick.parts.reduce((s,p)=>s+p.kcal,0) : 0;
    return '<div class="day-row'+(m.key===state.meal?' active':'')+'" data-meal-row="'+m.key+'">' +
      (pick ? '<img class="dr-thumb" src="'+dishImg(pick.name)+'" alt="" onerror="this.style.display=\'none\'">' : '') +
      '<span class="dr-meal">'+m.label+'</span>' +
      '<span class="dr-name">'+(pick ? esc(pick.name) : '还没选')+'</span>' +
      '<span class="dr-kcal">'+(pick ? kcal+' 大卡' : '')+'</span>' +
      (pick ? '<span class="dr-act" data-act="reroll" data-meal="'+m.key+'">换</span><span class="dr-act" data-act="clear" data-meal="'+m.key+'">清</span>' : '') +
    '</div>';
  }).join('');
  const total = MEALS.reduce((s,m)=> s + (state.dayPlan[m.key] ? state.dayPlan[m.key].parts.reduce((a,p)=>a+p.kcal,0) : 0), 0);
  $('day-plan').innerHTML =
    '<div class="section-title">今日已选</div>' + rows +
    '<div class="day-total"><span>全天合计</span><span><b>'+total+'</b> 大卡</span></div>' +
    '<button class="btn btn--ghost btn--block" id="btn-reset-day">重置今天</button>' +
    '<div class="row-reset-note">清空四餐选择，并删除今天的饮食记录（其他日期不受影响）</div>';
  $('btn-reset-day').onclick = resetDay;
  $('day-plan').querySelectorAll('.dr-act').forEach(el => {
    el.onclick = async e => {
      e.stopPropagation();
      const meal = el.dataset.meal;
      const label = mealLabel(meal);
      if (el.dataset.act === 'clear'){
        const pick = state.dayPlan[meal];
        const ok = await confirmModal(
          '清空'+label+'？',
          pick ? [label+'：'+pick.name+' 会被移除'] : [label+' 当前是空的'],
          '只会移除这一餐的选择，全天其他餐次不受影响。',
          '清空这一餐'
        );
        if (!ok) return;
        state.dayPlan[meal]=null;
        renderMealGrid(); renderDayPlan(); renderSlot();
        toast('已清空'+label);
      } else {
        state.meal = meal; renderMealGrid(); roll();
      }
    };
  });
  $('day-plan').querySelectorAll('[data-meal-row]').forEach(el => {
    el.onclick = () => {
      const meal = el.dataset.mealRow;
      state.meal = meal; renderMealGrid(); renderSlot(); renderDayPlan();
      window.scrollTo({top: $('slot-card').offsetTop - 90, behavior:'smooth'});
    };
  });
}
async function resetDay(){
  const hasPlan = Object.keys(state.dayPlan).some(k => state.dayPlan[k]);
  const today = readLog()[todayKey()];
  const hasLog = today && today.length;
  if (!hasPlan && !hasLog){
    toast('今天还没有任何选择');
    return;
  }
  const bullets = [];
  if (hasPlan) bullets.push('清空早餐 / 午餐 / 晚餐 / 夜宵已选的菜');
  if (hasLog) bullets.push('删除今天的 '+today.length+' 条饮食记录');
  if (!bullets.length) bullets.push('（今天暂时没有内容）');
  const ok = await confirmModal(
    '重置今天？',
    bullets,
    '只影响今天，其他日期的记录不受影响。',
    '确定重置'
  );
  if (!ok) return;
  state.dayPlan = { breakfast:null, lunch:null, dinner:null, supper:null };
  if (hasLog) deleteLogDay(todayKey());
  renderMealGrid(); renderSlot(); renderDayPlan(); renderHome();
  toast('已重置今天');
}
function roll(){
  if (state.rolling) return;
  const pool = DISHES.filter(d => d.meals.includes(state.meal));
  if (!pool.length){ $('slot-hint').textContent='这个餐段还没有菜品'; return; }
  const result = pool[Math.floor(Math.random()*pool.length)];
  state.rolling = true;
  $('btn-roll').disabled = true;
  $('slot-card').classList.remove('result','saved');
  $('slot-photo').src = '';
  $('slot-hint').textContent = '正在想…';
  let steps = 0;
  const total = 18 + Math.floor(Math.random()*12);
  const tick = () => {
    steps++;
    const p = steps/total, delay = 50 + p*p*260;
    const d = pool[steps % pool.length];
    $('slot-name').textContent = d.name;
    $('slot-photo').src = dishImg(d.name);
    if (steps >= total){
      const totalKcal = result.parts.reduce((s,pt)=>s+pt.kcal,0);
      $('slot-photo').src = dishImg(result.name);
      $('slot-name').textContent = result.name;
      $('slot-tag').textContent = mealLabel(state.meal)+' · '+SPICY_LABEL[result.spicy]+' · 共 '+totalKcal+' 大卡';
      $('slot-detail').innerHTML = result.parts.map(pt => esc(pt.name)+' '+esc(pt.grams)+' '+pt.kcal+'大卡').join(' · ');
      $('slot-card').classList.add('result');
      $('slot-hint').textContent = '就吃这个！';
      state.rolling = false;
      $('btn-roll').disabled = false;
      state.dayPlan[state.meal] = result;
      addLogItem({ name:result.name, kcal:totalKcal, meal:mealLabel(state.meal), mode:'随机' });
      renderMealGrid(); renderDayPlan(); renderSlot();
      if (navigator.vibrate) navigator.vibrate(40);
      return;
    }
    setTimeout(tick, delay);
  };
  tick();
}

function showLog(){ renderLog(); showScreen('log'); }
function renderLog(){
  const log = readLog();
  const days = Object.keys(log).sort().reverse();
  if (!days.length){
    $('log-list').innerHTML = '<div class="empty-tip">还没有任何记录，去选一顿吧</div>';
    return;
  }
  $('log-list').innerHTML = days.map(day => {
    const items = log[day];
    const total = dayTotal(items);
    return '<div class="log-day">' +
      '<div class="ld-head"><span class="ld-date">'+esc(dateLabel(day))+'</span>' +
      '<span><span class="ld-total">'+total+' 大卡</span><span class="ld-del" data-delday="'+day+'">删除当天</span></span></div>' +
      items.map((it,i) =>
        '<div class="log-item">' +
          '<span class="li-name">'+esc(it.name)+'</span>' +
          (it.meal?'<span class="li-meal">'+esc(it.meal)+'</span>':'') +
          '<span class="li-kcal">'+it.kcal+' 大卡</span>' +
          '<span class="li-del" data-day="'+day+'" data-idx="'+i+'">删</span>' +
        '</div>').join('') +
    '</div>';
  }).join('');
  $('log-list').querySelectorAll('.li-del').forEach(el => {
    el.onclick = () => { deleteLogItem(el.dataset.day, +el.dataset.idx); renderLog(); renderHome(); };
  });
  $('log-list').querySelectorAll('.ld-del').forEach(el => {
    el.onclick = () => { deleteLogDay(el.dataset.delday); renderLog(); renderHome(); };
  });
}

function openSettings(){
  const cur = KEY();
  const key = prompt('高德地图 Web服务 Key（留空则用演示数据）：\n\n获取方式：高德开放平台 lbs.amap.com → 注册 → 创建「Web服务」类型的 Key。', cur || '');
  if (key === null) return;
  const v = (key||'').trim();
  try {
    if (v) localStorage.setItem('amap_key', v);
    else localStorage.removeItem('amap_key');
    alert(v ? '✅ 已保存密钥' : '已清空密钥，将使用演示数据');
  } catch(e){ alert('保存失败：浏览器不支持本地存储'); }
}

$('card-wizard').onclick = startWizard;
$('card-random').onclick = startRandom;
$('today-card').onclick = showLog;
$('wizard-back').onclick = () => { showScreen('home'); renderHome(); };
$('dinein-back').onclick = () => { showScreen('home'); renderHome(); };
$('takeout-back').onclick = () => { showScreen('home'); renderHome(); };
$('random-back').onclick = () => { showScreen('home'); renderHome(); };
$('log-back').onclick = () => { showScreen('home'); renderHome(); };
$('btn-roll').onclick = roll;
$('btn-settings').onclick = openSettings;

renderHome();
</script>
