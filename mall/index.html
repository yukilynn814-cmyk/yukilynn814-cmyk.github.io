<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星选商城 · 经营驾驶舱</title>
<script src="https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js"></script>
<style>
/* ==================== 全局（写实金融风：黑灰底 + 克制红绿） ==================== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#141414; --panel:#1c1c1c; --panel2:#212121; --border:#2c2c2c;
  --txt:#d8d8d8; --sub:#8f8f8f; --dim:#5f5f5f;
  --up:#e04343;   /* 涨红（A股习惯） */
  --down:#2e9e6b; /* 跌绿 */
  --blue:#3b82c4; --warn:#e6a23c;
}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}
.num{font-variant-numeric:tabular-nums;font-family:"PingFang SC","Microsoft YaHei",monospace}

/* ==================== 顶栏（简洁深灰） ==================== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:14px;
  padding:9px 20px;background:#181818;border-bottom:1px solid var(--border)}
.logo{font-size:17px;font-weight:700;color:#e8e8e8;white-space:nowrap}
.logo span{color:var(--blue)}
.search{flex:1;max-width:340px;padding:7px 13px;border:1px solid var(--border);border-radius:4px;
  font-size:13px;outline:none;background:#141414;color:var(--txt)}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:#4a4a4a}
.switch-btn{margin-left:auto;padding:7px 16px;border-radius:4px;font-size:13px;font-weight:600;
  background:var(--blue);color:#fff;white-space:nowrap}
.switch-btn:hover{background:#3575b0}
.cart-btn{position:relative;font-size:19px;background:none;padding:4px;color:var(--txt)}
.cart-badge{position:absolute;top:-5px;right:-7px;background:var(--up);color:#fff;font-size:11px;
  border-radius:9px;padding:1px 5px;font-weight:700}

/* ==================== 视图切换（简洁淡入淡出，无花哨动效） ==================== */
.view{position:fixed;top:50px;left:0;right:0;bottom:0;opacity:0;pointer-events:none;
  transition:opacity .25s ease;overflow:auto}
.view.active{opacity:1;pointer-events:auto}

/* ==================== 顾客端 ==================== */
#storefront{background:#f4f4f5}
.store-wrap{max-width:1100px;margin:0 auto;padding:18px 24px 60px}
.cats{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.cat{padding:6px 16px;border-radius:4px;background:#e6e6e8;font-size:13px;color:#555}
.cat.active{background:#333;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid #e2e2e4;border-radius:6px;padding:14px}
.pcard:hover{border-color:#bbb}
.p-imgwrap{position:relative;height:150px;overflow:hidden;border-radius:4px;background:#eee;margin-bottom:8px}
.p-emoji-fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;z-index:0}
.p-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.p-name{font-size:13px;font-weight:600;margin:6px 0 3px;line-height:1.4;min-height:36px;color:#333}
.p-cat{font-size:11px;color:#aaa;margin-bottom:8px}
.p-foot{display:flex;align-items:center;justify-content:space-between}
.p-price{color:var(--up);font-weight:700;font-size:16px}
.p-price::before{content:"¥";font-size:12px}
.p-add{background:#333;color:#fff;width:28px;height:28px;border-radius:4px;font-size:17px;line-height:1}

/* ==================== 老板端（金融仪表盘） ==================== */
#dashboard{background:var(--bg)}
.dash-wrap{padding:16px 20px 40px}
.dash-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dash-top h1{font-size:17px;font-weight:700;color:#e8e8e8}
.dash-top .clock{font-size:12px;color:var(--sub);background:var(--panel);padding:5px 12px;border-radius:3px;border:1px solid var(--border)}

/* KPI（金融软件风格：黑底细边框，等宽数字） */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:12px 14px}
.kpi .k-label{font-size:12px;color:var(--sub);margin-bottom:6px}
.kpi .k-val{font-size:22px;font-weight:700;color:#e8e8e8}
.kpi .k-val small{font-size:12px;font-weight:400;color:var(--sub);margin-left:2px}
.kpi .k-trend{font-size:11px;margin-top:4px;color:var(--dim)}
.kpi .k-trend.up{color:var(--up)}
.kpi .k-trend.down{color:var(--down)}
.warn-ico{font-size:13px;margin-left:4px;vertical-align:1px}

/* 图表区 */
.charts{display:grid;grid-template-columns:1.6fr 1fr;gap:10px;margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:12px}
.panel h3{font-size:13px;color:#c0c0c0;margin-bottom:8px;font-weight:600;border-left:3px solid var(--blue);padding-left:8px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel-head h3{margin-bottom:0}
.trend-tabs{display:flex;gap:4px}
.ttab{padding:4px 12px;border-radius:3px;font-size:12px;background:transparent;border:1px solid var(--border);color:var(--sub)}
.ttab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.drill-back{padding:4px 12px;border-radius:3px;font-size:12px;background:transparent;border:1px solid var(--warn);color:var(--warn);white-space:nowrap}
.chart{height:260px}
.chart-sm{height:210px}
.chart-full{grid-column:1/-1}

/* 底部：决策台 + 知识卡片 */
.bottom{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.control-panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:14px}
.control-panel h3{font-size:13px;color:#c0c0c0;margin-bottom:14px;border-left:3px solid var(--blue);padding-left:8px}
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.slider-row .s-label{width:66px;font-size:13px;color:#b0b0b0;white-space:nowrap}
.slider-row .s-val{width:40px;font-size:13px;color:#e8e8e8;font-weight:600;text-align:right}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:#333;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:3px;
  background:#555;cursor:pointer;border:1px solid #777}

/* 商业知识卡片 */
.advice-panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:14px;overflow-y:auto}
.advice-panel h3{font-size:13px;color:#c0c0c0;margin-bottom:10px;border-left:3px solid var(--blue);padding-left:8px}
.kcard{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:10px}
.kcard:last-child{margin-bottom:0}
.kcard-head{display:flex;align-items:flex-start;gap:10px}
.kcard-head .k-ico{font-size:18px;line-height:1.3;flex-shrink:0}
.kcard-head .k-text{flex:1;font-size:13px;color:#d0d0d0;line-height:1.6}
.k-more{margin-top:8px;padding:5px 12px;border-radius:3px;font-size:12px;font-weight:600;
  background:transparent;border:1px solid var(--blue);color:var(--blue)}
.k-more:hover{background:rgba(59,130,196,0.12)}
.k-detail{max-height:0;overflow:hidden;transition:max-height .35s ease;border-top:1px solid transparent}
.kcard.open .k-detail{max-height:500px;border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.k-theory{font-size:12.5px;color:#b8b8b8;line-height:1.75}
.k-source{margin-top:8px;font-size:11.5px;color:var(--warn)}

/* 购物车/弹窗（顾客端，浅色） */
.cart-side{position:fixed;top:0;right:-340px;width:330px;height:100vh;background:#fff;z-index:110;
  transition:right .2s;box-shadow:-4px 0 16px rgba(0,0,0,0.2);display:flex;flex-direction:column}
.cart-side.open{right:0}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #eee}
.cart-head h3{font-size:15px;color:#333}
.cart-close{background:none;font-size:18px;color:#999}
.cart-list{flex:1;overflow-y:auto;padding:10px 18px}
.cart-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed #eee}
.cart-item .ci-emoji{font-size:24px}
.cart-item .ci-info{flex:1}
.cart-item .ci-name{font-size:13px;font-weight:600;color:#333}
.cart-item .ci-price{font-size:12px;color:#888}
.ci-qty{display:flex;align-items:center;gap:6px}
.ci-qty button{width:20px;height:20px;border-radius:3px;background:#eee;font-size:13px;color:#333}
.ci-del{background:none;color:#bbb;font-size:15px}
.cart-foot{padding:14px 18px;border-top:1px solid #eee}
.cart-total{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px;color:#333}
.cart-total b{color:var(--up);font-size:19px}
.checkout{width:100%;padding:12px;border-radius:4px;background:var(--up);color:#fff;font-weight:700;font-size:14px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:105;display:none}
.mask.show{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:6px;
  padding:22px;z-index:115;width:320px;display:none;box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.modal.show{display:block}
.modal h3{font-size:15px;margin-bottom:14px;color:#333}
.modal input{width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:4px;margin-bottom:9px;font-size:13px}
.modal-actions{display:flex;gap:9px;margin-top:5px}
.modal-actions button{flex:1;padding:10px;border-radius:4px;font-weight:600;font-size:13px}
.m-submit{background:var(--up);color:#fff}
.m-cancel{background:#eee;color:#555}

@media(max-width:768px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .charts,.bottom{grid-template-columns:1fr}
  .chart{height:210px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">星选<span>商城</span></div>
  <input class="search" id="searchInput" placeholder="搜索商品…" oninput="renderProducts()">
  <button class="switch-btn" id="switchBtn" onclick="toggleView()">📊 老板模式</button>
  <button class="cart-btn" id="cartBtn" onclick="openCart()">🛒<span class="cart-badge" id="cartBadge">0</span></button>
</div>

<!-- 顾客端 -->
<section class="view active" id="storefront">
  <div class="store-wrap">
    <div class="cats" id="catBar"></div>
    <div class="grid" id="productGrid"></div>
  </div>
</section>

<!-- 老板端 -->
<section class="view" id="dashboard">
  <div class="dash-wrap">
    <div class="dash-top">
      <h1>经营数据仪表盘</h1>
      <div class="clock" id="clockText">模拟时间 --</div>
    </div>
    <div class="kpis" id="kpiRow"></div>
    <div class="charts">
      <div class="panel chart-full">
        <div class="panel-head"><h3 id="trendTitle">实时经营趋势（近48小时）</h3>
          <button class="drill-back" id="drillBack" style="display:none" onclick="resetDrill()">× 返回全部</button>
          <div class="trend-tabs">
            <button class="ttab active" data-dim="revenue" onclick="setTrendDim('revenue')">销售额</button>
            <button class="ttab" data-dim="margin" onclick="setTrendDim('margin')">利润率</button>
            <button class="ttab" data-dim="orders" onclick="setTrendDim('orders')">订单量</button>
            <button class="ttab" data-dim="aov" onclick="setTrendDim('aov')">客单价</button>
          </div>
        </div>
        <div id="cTrend" class="chart"></div>
      </div>
      <div class="panel"><h3>品类销售占比</h3><div id="cCat" class="chart-sm"></div></div>
      <div class="panel"><h3>消费群体偏好</h3><div id="cRadar" class="chart-sm"></div></div>
    </div>
    <div class="bottom">
      <div class="control-panel">
        <h3>经营决策台</h3>
        <div class="slider-row"><span class="s-label">研发投入</span><input type="range" id="slRd" min="0" max="100" value="30" oninput="onSlider('rd',this.value)"><span class="s-val num" id="vRd">30</span></div>
        <div class="slider-row"><span class="s-label">折扣力度</span><input type="range" id="slDisc" min="0" max="50" value="10" oninput="onSlider('discount',this.value)"><span class="s-val num" id="vDisc">10%</span></div>
        <div class="slider-row"><span class="s-label">包装等级</span><input type="range" id="slPack" min="0" max="100" value="40" oninput="onSlider('packaging',this.value)"><span class="s-val num" id="vPack">40</span></div>
        <div class="slider-row"><span class="s-label">广告预算</span><input type="range" id="slAds" min="0" max="100" value="20" oninput="onSlider('ads',this.value)"><span class="s-val num" id="vAds">20</span></div>
      </div>
      <div class="advice-panel">
        <h3>商业洞察</h3>
        <div id="adviceList"></div>
      </div>
    </div>
  </div>
</section>

<div class="mask" id="mask" onclick="closeCart()"></div>
<div class="cart-side" id="cartSide">
  <div class="cart-head"><h3>🛒 购物车</h3><button class="cart-close" onclick="closeCart()">✕</button></div>
  <div class="cart-list" id="cartList"></div>
  <div class="cart-foot">
    <div class="cart-total"><span>合计</span><b>¥<span id="cartTotal">0</span></b></div>
    <button class="checkout" onclick="openCheckout()">去结算</button>
  </div>
</div>
<div class="modal" id="checkoutModal">
  <h3>📦 确认收货信息</h3>
  <input id="coName" placeholder="收货人姓名">
  <input id="coPhone" placeholder="手机号">
  <input id="coAddr" placeholder="收货地址">
  <div class="modal-actions">
    <button class="m-cancel" onclick="closeCheckout()">取消</button>
    <button class="m-submit" onclick="submitOrder()">提交订单</button>
  </div>
</div>

/* ============ 二、模拟引擎（单店体量，数值真实化） ============ */
const business={rd:30,discount:10,packaging:40,ads:20};
function hashNoise(seed){const x=Math.sin(seed*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
function hourFactor(h){
  return 1
    + 0.65*Math.exp(-Math.pow(h-9,2)/6)
    + 0.85*Math.exp(-Math.pow(h-20,2)/8)
    - 0.38*Math.exp(-Math.pow(h-3,2)/10);
}
// 单店体量：每小时基础订单 12 单，日销售额约 5~15 万元
function simulateTick(t){
  const h=((t%24)+24)%24;
  const tf=hourFactor(h);
  const b=business;
  const discountBoost=1+b.discount/100*1.6;
  const adsBoost     =1+b.ads/100*0.9;
  const rdBoost      =1+b.rd/100*0.5;
  const noise=0.94+hashNoise(t*7.13)*0.12;
  const orders=Math.round(12*tf*discountBoost*adsBoost*rdBoost*noise);
  const avgPrice=120*(1-b.discount/100);
  const revenue=Math.round(orders*avgPrice);      // 单位：元
  const margin=40 - b.discount*0.8 - b.rd*0.15 - b.packaging*0.08 - b.ads*0.12;
  const satisfaction=Math.min(100, 58 + b.rd*0.32 + b.packaging*0.2 + b.discount*0.3);
  const rdShift=b.rd/100*0.06, discShift=b.discount/100*0.08;
  const catRaw={
    "潮玩":0.18+hashNoise(t*3.1)*0.02-rdShift*0.2,
    "数码":0.22+rdShift,
    "服饰":0.16+discShift,
    "生活":0.13+hashNoise(t*5.7)*0.02-rdShift*0.5+discShift*0.15,
    "美妆个护":0.17+hashNoise(t*8.3)*0.02+discShift*0.4,
    "食品生鲜":0.14+hashNoise(t*11.7)*0.02+discShift*0.3,
  };
  const catSum=Object.values(catRaw).reduce((a,x)=>a+x,0);
  const catShare={};for(const k in catRaw)catShare[k]=catRaw[k]/catSum;
  const pref={
    "价格敏感":Math.min(100,40+b.discount*1.4),
    "颜值包装":Math.min(100,45+b.packaging*0.55),
    "性能质量":Math.min(100,42+b.rd*0.6),
    "性价比":Math.min(100,48+b.discount*0.6+b.rd*0.35),
    "品牌忠诚":Math.min(100,50+satisfaction*0.4),
  };
  return {h,orders,revenue,margin:Math.max(2,margin),aov:Math.round(revenue/Math.max(1,orders)),satisfaction,catShare,pref};
}

/* ============ 四、商业知识库（真实理论 + 出处） ============ */
const KB={
  elasticity:{title:"价格弹性",icon:"📉",
    theory:"需求量对价格变化的敏感度叫\"价格弹性\"。公式：需求弹性 = 需求量变动% ÷ 价格变动%。生活必需品弹性小（降价销量涨得少），非必需消费品弹性大（降价销量涨得多）。你拉大折扣 → 销量上升、但单价和利润率下降。关键看弹性：若弹性>1，降价反而提升总营收；若弹性<1，降价会拖垮利润。这就是为什么折扣不是越大越好。",
    source:"微观经济学核心概念；菲利普·科特勒《营销管理》定价策略章节"},
  pareto:{title:"二八定律",icon:"📊",
    theory:"帕累托法则（80/20）：大约 80% 的销售额，往往来自 20% 的商品或客户。经营上意味着：不该平均用力，而应识别并聚焦贡献最大的核心品类/爆款，把资源投到刀刃上。你的品类占比里，头部品类贡献越大，越要优先保它的库存和营销。",
    source:"维尔弗雷多·帕累托（1906 年）"},
  longtail:{title:"长尾效应",icon:"📚",
    theory:"克里斯·安德森在《长尾理论》中提出：在互联网零售里，大量小众商品（长尾）的累计销量，可以与少数热门商品（头部）相媲美。所以别只盯着爆款——那些销量平平的小众商品，集合起来也是一块可观、且竞争更小的利润来源。",
    source:"克里斯·安德森《长尾理论》(2006)"},
  fourP:{title:"4P 营销组合",icon:"🎯",
    theory:"科特勒的经典框架：营销 = 产品(Product) + 价格(Price) + 渠道(Place) + 促销(Promotion) 四要素协同。你这里的四个滑块，正是对这四个杠杆的调节：研发/包装=产品，折扣=价格，广告=促销。真正的经营能力，在于让四者平衡，而不是只拉某一个。",
    source:"菲利普·科特勒《营销管理》"},
  diminishing:{title:"边际效益递减",icon:"📉",
    theory:"在其它条件不变时，持续追加某一项投入（如广告、研发），每单位追加投入带来的额外产出会逐渐下降。比如广告从 0 加到 20 效果显著，但从 80 加到 100 收效甚微。所以投入不是越多越好，要找到\"边际收益 = 边际成本\"的临界点。",
    source:"经济学边际效用递减规律"},
  loyalty:{title:"顾客忠诚度",icon:"💗",
    theory:"满意的顾客 → 忠诚 → 复购。忠诚客户贡献更高的\"生命周期价值(LTV)\"，且获取新客成本远高于维护老客。净推荐值(NPS)就是衡量\"顾客愿不愿意推荐你\"的指标。当满意度走低时，短期看利润没变，长期看复购率会崩，所以满意度是必须盯住的前瞻指标。",
    source:"Fred Reichheld《终极问题》(2003)"},
};

/* ============ 五、智能建议 → 商业知识卡片 ============ */
function genAdvice(cur,prev){
  const cards=[];
  const growth=prev?cur.orders/prev.orders-1:0;
  // 利润率低 -> 价格弹性 + 警报
  if(cur.margin<22){
    cards.push({icon:"🚨",text:`当前利润率仅 ${cur.margin.toFixed(1)}%，处于偏低水平`,kb:"elasticity"});
  }
  // 满意度高但销量弱 -> 忠诚度 + 广告
  if(cur.satisfaction>=82 && growth<0.03){
    cards.push({icon:"💡",text:"产品口碑好（满意度高）但销量增长乏力",kb:"loyalty"});
  }
  // 销量猛增且利润足 -> 4P（可涨价）
  if(growth>0.35 && cur.margin>32){
    cards.push({icon:"💡",text:"销售势头强劲且利润空间充足",kb:"fourP"});
  }
  // 满意度不足 -> 忠诚度
  if(cur.satisfaction<62){
    cards.push({icon:"🚨",text:`顾客满意度仅 ${cur.satisfaction.toFixed(0)} 分，低于健康线`,kb:"loyalty"});
  }
  // 品类集中 -> 二八定律
  let topCat=null,topVal=0;
  for(const k in cur.catShare)if(cur.catShare[k]>topVal){topVal=cur.catShare[k];topCat=k;}
  if(topCat&&topVal>0.32){
    cards.push({icon:"📊",text:`「${topCat}」品类销售额占比 ${(topVal*100).toFixed(1)}%，集中度较高`,kb:"pareto"});
  }
  // 广告/研发拉满 -> 边际递减提醒
  if(business.ads>80||business.rd>80){
    cards.push({icon:"💡",text:"某项投入已处于高位，注意边际效益递减",kb:"diminishing"});
  }
  // 无异常 -> 平稳
  if(!cards.length){
    cards.push({icon:"✅",text:"经营状况平稳，各项指标处于健康区间",kb:"fourP"});
  }
  return cards;
}
let lastAdviceKey="";
function renderAdvice(){
  const cur=history[history.length-1],prev=history[history.length-2];
  const cards=genAdvice(cur,prev);
  const key=JSON.stringify(cards.map(c=>c.icon+c.text+c.kb));

}

    return `<div class="cart-item"><span class="ci-emoji">${p.emoji}</span>
      <div class="ci-info"><div class="ci-name">${p.name}</div><div class="ci-price">¥${p.price} × ${q}</div></div>
      <div class="ci-qty"><button onclick="chgQty(${id},-1)">−</button><span>${q}</span><button onclick="chgQty(${id},1)">+</button></div>
      <button class="ci-del" onclick="delItem(${id})">✕</button></div>`;
  }).join("");
  document.getElementById("cartTotal").textContent=total;
}
function chgQty(pid,d){cart[pid]+=d;if(cart[pid]<=0)delete cart[pid];updateCartBadge();renderCart();}
function delItem(pid){delete cart[pid];updateCartBadge();renderCart();}
function openCheckout(){if(!Object.keys(cart).length){alert("购物车是空的");return;}document.getElementById("checkoutModal").classList.add("show");document.getElementById("mask").classList.add("show");}
function closeCheckout(){document.getElementById("checkoutModal").classList.remove("show");document.getElementById("mask").classList.remove("show");}
function submitOrder(){
  const name=document.getElementById("coName").value.trim(),phone=document.getElementById("coPhone").value.trim(),addr=document.getElementById("coAddr").value.trim();
  if(!name||!phone||!addr){alert("请填写完整收货信息");return;}
  for(const id in cart)delete cart[id];
  updateCartBadge();closeCheckout();closeCart();alert("🎉 下单成功！感谢购买");
}

/* ============ 十一、视图切换（简洁淡入淡出） ============ */
let inDash=false;
function toggleView(){
  inDash=!inDash;
  document.getElementById("storefront").classList.toggle("active",!inDash);
  document.getElementById("dashboard").classList.toggle("active",inDash);
  document.getElementById("switchBtn").textContent=inDash?"🛍 顾客模式":"📊 老板模式";
  document.querySelector(".search").style.display=inDash?"none":"block";
  document.getElementById("cartBtn").style.display=inDash?"none":"block";
  if(inDash){cTrend&&cTrend.resize();cCat&&cCat.resize();cRadar&&cRadar.resize();}
}

/* ============ 十二、启动 ============ */
renderCatBar();renderProducts();updateCartBadge();
initCharts();rebuildHistory();updateCharts();updateKPIs();renderAdvice();
document.getElementById("clockText").textContent="模拟时间 · 第1小时（00:00）";
</script>
